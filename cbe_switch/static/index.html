<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Switch-Sync-Everywhere</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><div><p class="eyebrow">LOCAL CONFIGURATION</p><h1>Switch-Sync-Everywhere</h1><p class="muted">管理 Codex 配置模板，预览后安全应用到本机。</p></div><button id="newBtn" class="primary">新建配置</button></header>
<section class="layout"><aside><div class="section-title"><h2>配置</h2><button id="refreshBtn" title="刷新">↻</button></div><div id="profiles" class="list"></div><h2 class="backup-title">备份</h2><div id="backups" class="list"></div></aside>
<section class="editor"><div id="empty" class="empty">选择一个配置，或创建新的配置。</div><form id="form" hidden><div class="form-head"><div><label>配置名称<input name="name" required></label><div id="status" class="status"></div></div><div class="actions"><button type="button" id="duplicateBtn">复制</button><button type="button" id="deleteBtn" class="danger">删除</button><button type="button" id="activateBtn" class="primary">应用到 Codex</button></div></div><div class="grid"><label>API Key<input name="key" type="password"></label><label>URL<input name="url" type="url" required></label></div><div class="templates"><label>config.toml 模板<textarea name="config_template" spellcheck="false"></textarea></label><label>auth.json 模板<textarea name="auth_template" spellcheck="false"></textarea></label></div><div class="bottom"><button class="primary" type="submit">保存配置</button><button type="button" id="previewBtn">渲染预览</button><span id="message"></span></div><div id="preview" class="preview" hidden><h3>渲染结果</h3><div class="preview-grid"><pre id="configPreview"></pre><pre id="authPreview"></pre></div></div></form></section></section></main><script src="/static/app.js"></script></body></html>
