<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Switch-Sync-Everywhere</title><link rel="stylesheet" href="/static/style.css?v=9"><link rel="stylesheet" href="/static/controls.css?v=7"></head>
<body><main><header><div><p class="eyebrow">LOCAL CONFIGURATION</p><h1>Switch-Sync-Everywhere</h1><p class="muted">管理 Codex 配置模板，预览后安全应用到本机。</p></div><button id="newBtn" class="primary">新建配置</button></header>
<section class="layout"><aside><div class="section-title"><h2>配置</h2><button id="refreshBtn" title="刷新">↻</button></div><div id="profiles" class="list"></div><h2 class="backup-title">备份</h2><div id="backups" class="list"></div></aside>
<section class="editor"><div id="empty" class="empty">选择一个配置，或创建新的配置。</div><form id="form" hidden><div class="form-head"><div><label>配置名称<input name="name" required></label><div id="status" class="status"></div></div><div class="actions"><button type="button" id="duplicateBtn" class="tool-button" title="复制配置" aria-label="复制配置">复制</button><button type="button" id="deleteBtn" class="tool-button danger" title="删除配置" aria-label="删除配置">删除</button><button type="button" id="activateBtn" class="primary apply-button">应用到 Codex</button></div></div><div class="grid"><label>API Key<input name="key" type="password"></label><label>URL<input name="url" type="url" required></label><fieldset class="permission-field"><legend>默认权限</legend><input type="hidden" name="permission_mode" value="ask"><div class="permission-picker" role="radiogroup" aria-label="默认权限"><button type="button" class="permission-option selected" data-mode="ask" role="radio" aria-checked="true"><strong>Ask for approval</strong><span>每次需要操作时请求批准</span></button><button type="button" class="permission-option" data-mode="approve-for-me" role="radio" aria-checked="false"><strong>Approve for me</strong><span>由 Codex 自动处理批准</span></button><button type="button" class="permission-option" data-mode="full-access" role="radio" aria-checked="false"><strong>Full access</strong><span>完全访问本机文件和命令</span></button></div></fieldset></div><div class="templates"><label>config.toml<textarea name="config_template" spellcheck="false"></textarea></label><label>auth.json<textarea name="auth_template" spellcheck="false"></textarea></label></div><div class="bottom"><button class="save-button" type="submit">保存配置</button><span id="message"></span></div></form></section></section></main><script src="/static/app.js?v=7"></script></body></html>
